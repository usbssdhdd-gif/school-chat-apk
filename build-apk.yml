name: Build Element Android APK
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'نام نمایشی اپلیکیشن'
        required: true
        default: 'Andisheh Hoseini Chat'
      server_url:
        description: 'آدرس سرور ماتریکس'
        required: true
        default: 'https://gap.andishehoseini.com'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Element Android Source
        uses: actions/checkout@v3
        with:
          repository: 'vector-im/element-android'
          ref: 'v1.6.5'

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Download and Replace Logo
        run: |
          # دانلود لوگو از آدرس شما
          wget -O logo.png "https://andishehoseini.com/video/logo.png"
          
          # تبدیل PNG به فرمت‌های مورد نیاز اندروید (با استفاده از ImageMagick که روی سرور گیت‌هاب نصب است)
          sudo apt-get update && sudo apt-get install -y imagemagick
          
          # جایگزینی آیکون‌ها در سایزهای مختلف
          convert logo.png -resize 48x48 vector/src/main/res/mipmap-mdpi/ic_launcher.png
          convert logo.png -resize 72x72 vector/src/main/res/mipmap-hdpi/ic_launcher.png
          convert logo.png -resize 96x96 vector/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert logo.png -resize 144x144 vector/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert logo.png -resize 192x192 vector/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          
          # جایگزینی آیکون دایره‌ای (Adaptive Icon)
          convert logo.png -resize 108x108 vector/src/main/res/mipmap-anydpi-v26/ic_launcher_foreground.png

      - name: Customize App Name and Server
        run: |
          sed -i 's/<string name="app_name">Element<\/string>/<string name="app_name">${{ github.event.inputs.app_name }}<\/string>/g' vector/src/main/res/values/strings.xml
          echo "{\"default_server_config\":{\"m.homeserver\":{\"base_url\":\"${{ github.event.inputs.server_url }}\",\"server_name\":\"${{ github.event.inputs.server_url }}\"}},\"disable_custom_urls\":true}" > vector/src/main/res/raw/config.json

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: SchoolChat-APK
          path: vector/build/outputs/apk/vector/release/vector-release.apk
